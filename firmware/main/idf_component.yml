# Managed dependencies (ESP-IDF Component Manager).
#
# Bluepad32 provides the Classic HID host. Its official ESP-IDF integration
# installs the bundled BTstack component into ESP-IDF itself.
dependencies:
  idf:
    version: ">=5.3.0"

  # The component is nested in the Bluepad32 repository and is not published
  # under the ESP Component Registry namespace.
  bluepad32:
    git: https://github.com/ricardoquesada/bluepad32.git
    path: src/components/bluepad32
    version: e9b755faabc240585da42e6d26164bb2cdd064d3

  # Bluepad32's ESP32 console sources require these sibling components.
  cmd_nvs:
    git: https://github.com/ricardoquesada/bluepad32.git
    path: src/components/cmd_nvs
    version: e9b755faabc240585da42e6d26164bb2cdd064d3
  cmd_system:
    git: https://github.com/ricardoquesada/bluepad32.git
    path: src/components/cmd_system
    version: e9b755faabc240585da42e6d26164bb2cdd064d3

  # WS2812 status LED.
  espressif/led_strip:
    version: "^2.5.5"

  # mDNS for Config Mode STA (joycon-bridge.local).
  espressif/mdns:
    version: "^1.2.0"
